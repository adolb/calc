<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OTA Calculator</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OTA Calc">
<meta name="mobile-web-app-capable" content="yes">

<style>
    /* Mengatur font dasar menjadi lebih besar */
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif; font-size: 16px;}
    
    body{
        background:#0f172a;
        padding: calc(16px + env(safe-area-inset-top)) 16px 16px 16px;
        color:white;
        transition: all 0.3s ease;
    }
    
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .layout-btn { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 10px 18px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
    
    .container { display: flex; flex-direction: column; gap: 20px; max-width: 520px; margin: auto; }
    .left-panel, .right-panel { background:#1e293b; border-radius:20px; padding:24px; width: 100%; }
    
    h1{font-size: 32px;}
    .sub{color:#94a3b8;margin-bottom:16px;font-size:18px;}
    label{display:block;margin-top:15px;margin-bottom:10px;font-weight:600;font-size:18px;}
    select,input{width:100%;padding:14px;font-size:20px;border:none;border-radius:12px;background:#334155;color:white;outline:none;}
    .input-row{display:flex;gap:10px;align-items:center;}
    input{flex:1;}
    button{padding:14px 20px;border:none;border-radius:12px;color:white;font-weight:600;cursor:pointer;background:#16a34a;font-size:18px;}
    
    .status{margin-top:12px;font-size:14px;padding:8px 12px;border-radius:8px;display:inline-block;}
    .yellow{background:#f59e0b;color:#111;}.green{background:#22c55e;color:#111;}
    
    .result{margin-top:20px;background:#16a34a;padding:20px;border-radius:16px;text-align:center;color:white;}
    .resultTitle{font-size:16px; margin-bottom: 6px;}
    .big{font-size:42px; font-weight:bold; margin-bottom: 12px;}
    .subinfo{font-size:16px; font-weight: 500; line-height: 1.6;}

    .row{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-top:20px;}
    .box{background:#0f172a;padding:12px;border-radius:10px;text-align:center;font-size:14px;}
    .box b { font-size: 18px; }
    
    .history-title { font-size: 22px; font-weight: bold; margin-bottom: 16px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
    .history{font-size:16px; color:#cbd5e1;}
    .hist-item{margin-bottom:12px; border-bottom:1px solid #334155; padding-bottom:10px;}
    .hist-main{font-family:monospace; font-weight: bold; font-size: 18px;}
    .hist-split{font-size:14px; color:#94a3b8; margin-top:5px; line-height: 1.5; display: flex; flex-wrap: wrap; gap: 10px;}
</style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="header-row">
            <h1>OTA Calculator</h1>
            <button class="layout-btn" onclick="toggleLayout()" id="layoutBtn">Portrait</button>
        </div>
        <div class="sub">Traveloka / My Horison</div>
        
        <label>OTA</label>
        <select id="ota"><option value="traveloka">Traveloka</option><option value="my">My Horison</option></select>
        
        <label>Voucher</label>
        <div class="input-row">
            <input id="input" type="tel" inputmode="numeric" placeholder="Masukkan harga...">
            <button onclick="submit()">Submit</button>
        </div>
        <div id="status" class="status yellow">🟡 Belum disimpan</div>
        
        <div class="result">
            <div class="resultTitle">Room Revenue (Net)</div>
            <div id="net" class="big">Rp 0</div>
            <div class="subinfo">
                Harga Tamu (Gross): <span id="gross">Rp 0</span><br>
                Potongan OTA: <span id="cut">Rp 0</span>
            </div>
        </div>

        <div class="row" id="gridBox"></div>
    </div>

    <div class="right-panel">
        <div class="history-title">History</div>
        <div class="history" id="historyBox">Belum ada history</div>
        <button onclick="clearHistory()" style="background:#ef4444; width:100%; margin-top:20px; font-size: 16px;">Clear History</button>
    </div>
</div>

<script>
    const gridBox = document.getElementById("gridBox");
    gridBox.innerHTML = [2,3,4,5,6,7].map(i => `<div class="box" id="d${i}">÷${i}<br><b>0</b></div>`).join('');

    let h = JSON.parse(localStorage.getItem("otaHistory")) || [];
    
    const inputEl = document.getElementById("input");
    const otaEl = document.getElementById("ota");
    const netEl = document.getElementById("net");
    const grossEl = document.getElementById("gross");
    const cutEl = document.getElementById("cut");
    const statusEl = document.getElementById("status");
    const historyBoxEl = document.getElementById("historyBox");
    const layoutBtn = document.getElementById("layoutBtn");

    function renderHistory() {
        if(h.length === 0) {
            historyBoxEl.innerHTML = "Belum ada history";
            return;
        }
        historyBoxEl.innerHTML = h.map(x => {
            let splitValues = [2, 3, 4, 5, 6]
                .map(div => "<span>÷" + div + ":" + n(x.netVal / div) + "</span>")
                .join("");
            return "<div class='hist-item'>" +
                "<div class='hist-main'>" + n(x.inputVal) + " -> " + n(x.netVal) + " • " + x.ota.toUpperCase() + "</div>" +
                "<div class='hist-split'>" + splitValues + "</div>" +
            "</div>";
        }).join("");
    }

    renderHistory();

    function clearHistory() {
        if(confirm("Hapus semua history?")) {
            h = [];
            localStorage.removeItem("otaHistory");
            renderHistory();
        }
    }

    function toggleLayout() {
        document.body.classList.toggle("landscape-mode");
        layoutBtn.innerHTML = document.body.classList.contains("landscape-mode") ? "Landscape" : "Portrait";
    }

    function r(x){ return "Rp " + Math.round(x).toLocaleString("id-ID"); }
    function n(x){ return Math.round(x).toLocaleString("id-ID"); }
    function c(v){ return parseFloat((v||"").replace(/[^0-9]/g,''))||0; }

    function calc(){
        let raw = inputEl.value;
        let val = c(raw);
        let o = otaEl.value;
        
        if(val > 0) inputEl.value = val.toLocaleString("id-ID");
        if(!val){
            netEl.innerHTML="Rp 0"; grossEl.innerHTML="Rp 0"; cutEl.innerHTML="Rp 0";
            for(let i=2; i<=7; i++) document.getElementById("d"+i).innerHTML = "÷"+i+"<br><b>0</b>";
            return null;
        }
        
        let netV = (o=="traveloka") ? (val/0.82)*0.75 : val*0.88;
        let grossV = (o=="traveloka") ? val/0.82 : val;
        
        netEl.innerHTML = r(netV);
        grossEl.innerHTML = r(grossV);
        cutEl.innerHTML = r(grossV - netV);
        
        for(let i=2; i<=7; i++) {
            document.getElementById("d"+i).innerHTML = "÷"+i+"<br><b>"+n(netV/i)+"</b>";
        }
        
        statusEl.innerHTML = "🟡 Belum disimpan";
        statusEl.className = "status yellow";
        return { netVal: netV, inputVal: val, ota: o };
    }

    function submit(){
        let res = calc();
        if(res){
            h.push(res);
            h.sort((a, b) => a.netVal - b.netVal);
            localStorage.setItem("otaHistory", JSON.stringify(h));
            renderHistory();
            inputEl.value = ""; 
            statusEl.innerHTML = "🟢 Tersimpan ke History";
            statusEl.className = "status green";
        }
    }
    
    inputEl.oninput = calc;
    otaEl.onchange = calc;
</script>
</body>
</html>
