<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OTA Calculator</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
        body{background:#0f172a;padding:16px;color:white;display:flex;justify-content:center;}
        .card{width:100%;max-width:520px;background:#1e293b;border-radius:18px;padding:20px;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);}
        h1{font-size:26px;margin-bottom:6px;}
        .sub{color:#94a3b8;margin-bottom:12px;}
        label{display:block;margin-top:14px;margin-bottom:6px;font-weight:600;}
        select,input{width:100%;padding:14px;font-size:18px;border:none;border-radius:10px;background:#334155;color:white;outline:none;}
        .input-row{display:flex;gap:8px;align-items:center;}
        input{flex:1;}
        button{padding:14px 20px;border:none;border-radius:10px;color:white;font-weight:600;cursor:pointer;background:#16a34a;white-space:nowrap;}
        .status{margin-top:12px;font-size:12px;padding:6px 10px;border-radius:8px;display:inline-block;}
        .yellow{background:#f59e0b;color:#111;}.green{background:#22c55e;color:#111;}
        
        .result{margin-top:16px;background:#16a34a;padding:20px;border-radius:14px;text-align:center;color:white;}
        .resultTitle{font-size:16px;margin-bottom:5px;}
        .big{font-size:40px;font-weight:bold;margin-bottom:15px;}
        .subinfo{font-size:15px;font-weight:500;}

        .row{display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;margin-top:12px;}
        .box{background:#0f172a;padding:8px;border-radius:8px;text-align:center;font-size:11px;}
        
        .history{margin-top:16px;background:#0f172a;padding:12px;border-radius:10px;max-height:160px;overflow:auto;font-size:12px;color:#cbd5e1;}
        .hist-item{margin-bottom:6px;border-bottom:1px solid #1e293b;padding-bottom:4px;font-family:monospace;}
    </style>
</head>
<body>

<div class="card">
    <h1>OTA Calculator</h1>
    <div class="sub">Traveloka / My Horison</div>
    
    <label>OTA</label>
    <select id="ota">
        <option value="traveloka">Traveloka</option>
        <option value="my">My Horison</option>
    </select>
    
    <label>Voucher</label>
    <div class="input-row">
        <input id="input" type="tel" inputmode="numeric" placeholder="Masukkan harga...">
        <button onclick="submit()">Submit</button>
    </div>
    
    <div id="status" class="status yellow">🟡 Belum disimpan</div>
    
    <div class="result">
        <div class="resultTitle">Room Revenue (Net)</div>
        <div id="net" class="big">Rp 0</div>
        <div class="subinfo">
            Harga Tamu (Gross): <span id="gross">Rp 0</span><br>
            Potongan OTA: <span id="cut">Rp 0</span>
        </div>
    </div>

    <div class="row" id="grid">
        </div>

    <div class="history" id="historyBox">Belum ada history</div>
</div>

<script>
    let h = [];
    // Generate grid box saat load
    document.getElementById("grid").innerHTML = [2,3,4,5,6,7,8,9].map(i => `<div class="box" id="d${i}">÷${i}<br><b>0</b></div>`).join('');

    function r(x){ return "Rp " + Math.round(x).toLocaleString("id-ID"); }
    function n(x){ return Math.round(x).toLocaleString("id-ID"); }
    function c(v){ return parseFloat((v||"").replace(/[^0-9]/g,''))||0; }

    function calc(){
        let raw = document.getElementById("input").value;
        let val = c(raw);
        let o = document.getElementById("ota").value;
        
        if(val > 0) document.getElementById("input").value = val.toLocaleString("id-ID");
        if(!val){
            document.getElementById("net").innerHTML="Rp 0"; 
            document.getElementById("gross").innerHTML="Rp 0"; 
            document.getElementById("cut").innerHTML="Rp 0";
            return null;
        }

        let netV = (o=="traveloka") ? (val/0.82)*0.75 : val*0.88;
        let grossV = (o=="traveloka") ? val/0.82 : val;
        
        document.getElementById("net").innerHTML = r(netV);
        document.getElementById("gross").innerHTML = r(grossV);
        document.getElementById("cut").innerHTML = r(grossV - netV);
        
        for(let i=2; i<=9; i++) {
            document.getElementById("d"+i).innerHTML = "÷"+i+"<br><b>"+n(netV/i)+"</b>";
        }
        
        document.getElementById("status").innerHTML = "🟡 Belum disimpan";
        document.getElementById("status").className = "status yellow";
        return { netVal: netV, inputVal: val, ota: o };
    }

    function submit(){
        let res = calc();
        if(res){
            h.push(res);
            h.sort((a, b) => a.netVal - b.netVal);
            document.getElementById("historyBox").innerHTML = h.map(x => 
                "<div class='hist-item'>" + r(x.inputVal) + " -> " + r(x.netVal) + " • " + x.ota.toUpperCase() + "</div>"
            ).join("");
            document.getElementById("status").innerHTML = "🟢 Tersimpan ke History";
            document.getElementById("status").className = "status green";
        }
    }

    document.getElementById("input").oninput = calc;
    document.getElementById("ota").onchange = calc;
</script>

</body>
</html>
