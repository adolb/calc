<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OTA Calculator</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OTA Calc">
<meta name="mobile-web-app-capable" content="yes">

<style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif; font-size: 16px;}
    body{background:#0f172a;padding: calc(16px + env(safe-area-inset-top)) 16px 16px 16px;color:white;transition: all 0.3s ease;}
    
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .layout-btn { background: #334155; color: #cbd5e1; border: 1px solid #475569; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .container { display: flex; flex-direction: column; gap: 16px; max-width: 520px; margin: auto; }
    .left-panel, .right-panel { background:#1e293b; border-radius:18px; padding:18px; width: 100%; }
    
    body.landscape-mode .container { flex-direction: row; max-width: 1100px; align-items: flex-start; }
    body.landscape-mode .left-panel { flex: 1.2; }
    body.landscape-mode .right-panel { flex: 1; align-self: stretch; }

    h1{font-size:26px;}
    .sub{color:#94a3b8;margin-bottom:12px;font-size:16px;}
    label{display:block;margin-top:10px;margin-bottom:6px;font-weight:600;font-size:16px;}
    select,input{width:100%;padding:12px;font-size:18px;border:none;border-radius:10px;background:#334155;color:white;outline:none;}
    .input-row{display:flex;gap:8px;align-items:center;}
    input{flex:1;}
    button{padding:12px 16px;border:none;border-radius:10px;color:white;font-weight:600;cursor:pointer;background:#16a34a;font-size:16px;}
    .status{margin-top:10px;font-size:14px;padding:6px 10px;border-radius:8px;display:inline-block;}
    .yellow{background:#f59e0b;color:#111;}.green{background:#22c55e;color:#111;}
    
    .result{margin-top:12px;background:#16a34a;padding:16px;border-radius:14px;text-align:center;color:white;}
    .big{font-size:38px; font-weight:bold; margin-bottom:10px;}
    .row{display:grid;grid-template-columns:repeat(4, 1fr);gap:8px;margin-top:10px;}
    .box{background:#0f172a;padding:8px;border-radius:8px;text-align:center;font-size:14px;}
    
    .history-title { font-size: 20px; font-weight: bold; margin-bottom: 16px; }
    .chat-bubble { background: #334155; padding: 12px; border-radius: 15px; margin-bottom: 15px; border-top-left-radius: 2px; }
    .chat-header { font-weight: bold; font-family: monospace; color: #fff; margin-bottom: 8px; border-bottom: 1px solid #475569; padding-bottom: 4px; font-size: 14px;}
    .chat-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px 10px;
        font-family: monospace;
        font-size: 13px;
        color: #cbd5e1;
    }
</style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="header-row">
            <h1>OTA Calculator</h1>
            <button class="layout-btn" onclick="toggleLayout()" id="layoutBtn">Portrait</button>
        </div>
        <div class="sub">Traveloka / My Horison</div>
        <label>OTA</label>
        <select id="ota"><option value="traveloka">Traveloka</option><option value="my">My Horison</option></select>
        <label>Voucher</label>
        <div class="input-row">
            <input id="input" type="tel" inputmode="numeric" placeholder="Masukkan harga...">
            <button onclick="submit()">Submit</button>
        </div>
        <div id="status" class="status yellow">🟡 Belum disimpan</div>
        <div class="result">
            <div style="font-size:14px;">Room Revenue (Net)</div>
            <div id="net" class="big">Rp 0</div>
        </div>
        <div class="row" id="gridBox"></div>
    </div>

    <div class="right-panel">
        <div class="history-title">History</div>
        <div id="historyBox">Belum ada history</div>
        <button onclick="clearHistory()" style="background:#ef4444; width:100%; margin-top:15px; padding: 10px; border-radius: 10px; color: white; cursor: pointer; border: none; font-size: 14px;">Clear History</button>
    </div>
</div>

<script>
    const gridBox = document.getElementById("gridBox");
    gridBox.innerHTML = [2,3,4,5,6,7,8,9].map(i => `<div class="box" id="d${i}">÷${i}<br><b>0</b></div>`).join('');

    let h = JSON.parse(localStorage.getItem("otaHistory")) || [];
    
    function renderHistory() {
        if(h.length === 0) {
            document.getElementById("historyBox").innerHTML = "Belum ada history";
            return;
        }
        document.getElementById("historyBox").innerHTML = h.map(x => {
            let items = [1, 2, 3, 4, 5, 6].map(i => `<div>${i+1}/ ${n(x.netVal / (i+1))}</div>`).join("");
            return `
                <div class="chat-bubble">
                    <div class="chat-header">${n(x.inputVal)} -> ${n(x.netVal)} • ${x.ota.toUpperCase()}</div>
                    <div class="chat-grid">${items}</div>
                </div>`;
        }).join("");
    }

    function n(x){ return Math.round(x).toLocaleString("id-ID"); }
    function c(v){ return parseFloat((v||"").replace(/[^0-9]/g,''))||0; }

    function calc(){
        let val = c(document.getElementById("input").value);
        let o = document.getElementById("ota").value;
        if(val > 0) document.getElementById("input").value = val.toLocaleString("id-ID");
        let netV = (o=="traveloka") ? (val/0.82)*0.75 : val*0.88;
        document.getElementById("net").innerHTML = "Rp " + n(netV);
        for(let i=2; i<=9; i++) document.getElementById("d"+i).innerHTML = "÷"+i+"<br><b>"+n(netV/i)+"</b>";
        return { netVal: netV, inputVal: val, ota: o };
    }

    function submit(){
        let res = calc();
        if(res.inputVal > 0){
            h.unshift(res); 
            localStorage.setItem("otaHistory", JSON.stringify(h));
            renderHistory();
            document.getElementById("input").value = ""; 
            document.getElementById("status").innerHTML = "🟢 Tersimpan";
            document.getElementById("status").className = "status green";
        }
    }

    function clearHistory() {
        if(confirm("Hapus semua history?")) {
            h = [];
            localStorage.removeItem("otaHistory");
            renderHistory();
        }
    }

    function toggleLayout() {
        document.body.classList.toggle("landscape-mode");
        document.getElementById("layoutBtn").innerHTML = document.body.classList.contains("landscape-mode") ? "Landscape" : "Portrait";
    }

    document.getElementById("input").oninput = calc;
    document.getElementById("ota").onchange = calc;
    renderHistory();
</script>
</body>
</html>
