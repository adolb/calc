<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supabase Upload Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h2>Upload Test</h2>
<input type="file" id="file">
<button onclick="upload()">Upload</button>
<ul id="list"></ul>

<script>
const SUPABASE_URL="https://awlxjzfadktcthbumxle.supabase.co";
const SUPABASE_KEY="GANTI_DENGAN_PUBLISHABLE_KEY_ANDA";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function upload(){
 const f=document.getElementById('file').files[0];
 if(!f) return alert('Pilih file');
 const name=Date.now()+"_"+f.name;
 const {error}=await sb.storage.from('files').upload(name,f);
 if(error){alert(error.message);return;}
 alert('Upload berhasil');
 loadFiles();
}
async function loadFiles(){
 const {data,error}=await sb.storage.from('files').list();
 const ul=document.getElementById('list');
 ul.innerHTML='';
 if(error){ul.innerHTML='<li>'+error.message+'</li>';return;}
 data.forEach(x=>{
  const li=document.createElement('li');
  const {data:url}=sb.storage.from('files').getPublicUrl(x.name);
  li.innerHTML=`<a href="${url.publicUrl}" target="_blank">${x.name}</a>`;
  ul.appendChild(li);
 });
}
loadFiles();
</script>
</body>
</html>
