<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatan & Upload Supabase</title>
    <!-- Panggil Library Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 0 20px; 
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="file"] { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button { 
            padding: 12px 15px; 
            background-color: #24b47e; 
            color: white; 
            border: none; 
            border-radius: 4px;
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 10px; 
        }
        button:hover { 
            background-color: #1c8c62; 
        }
        h2 {
            margin-top: 30px;
            border-bottom: 2px solid #24b47e;
            padding-bottom: 5px;
        }
        .note-item { 
            background: #fff;
            border: 1px solid #eee;
            border-left: 5px solid #24b47e;
            padding: 15px; 
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .note-item h3 { 
            margin: 0 0 5px 0; 
            color: #111;
        }
        .note-item img { 
            max-width: 100%; 
            height: auto;
            display: block; 
            margin-top: 10px; 
            border-radius: 4px; 
            border: 1px solid #ddd;
        }
        .note-item small { 
            color: #666; 
            font-size: 12px;
        }
        .download-link {
            display: inline-block;
            margin-top: 10px;
            color: #24b47e;
            text-decoration: none;
            font-weight: bold;
        }
        .download-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Catatan & File Saya</h1>

        <!-- Form Input -->
        <div class="form-group">
            <label for="input-judul">Judul Catatan:</label>
            <input type="text" id="input-judul" placeholder="Tulis judul catatan...">
        </div>
        <div class="form-group">
            <label for="input-file">Pilih File/Gambar (Opsional):</label>
            <input type="file" id="input-file">
        </div>
        <button onclick="simpanSemua()">Simpan Catatan & File</button>

        <h2>Daftar Catatan</h2>
        <div id="daftar-catatan">Memuat catatan...</div>
    </div>

    <script>
        // Konfigurasi Supabase menggunakan kredensial proyek Anda
        const SUPABASE_URL = 'https://awlxjzfadktcthbumxle.supabase.co';
        
        // SUDAH DIPERBAIKI: Memakai token JWT asli yang Anda kirimkan
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3bHhqemZhZGt0Y3RoYnVteGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODU3NzgsImV4cCI6MjA5OTM2MTc3OH0.ktRLTXfsYmzb5RH8qKci0FgENkqqVG9atz5sHls9RXI';
        
        // Inisialisasi Klien Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Fungsi Mengambil Catatan dari Tabel 'Notes' dan Menampilkannya
        async function ambilCatatan() {
            const wadahCatatan = document.getElementById('daftar-catatan');
            
            const { data, error } = await supabaseClient
                .from('Notes')
                .select('*')
                .order('created_at', { ascending: false }); // Urutkan dari yang terbaru

            if (error) {
                console.error('Error ambil data:', error);
                wadahCatatan.innerHTML = '<p style="color:red;">Gagal memuat catatan. Periksa kembali tabel Notes Anda.</p>';
                return;
            }
            if (data.length === 0) {
                wadahCatatan.innerHTML = '<p>Belum ada catatan.</p>';
                return;
            }

            wadahCatatan.innerHTML = '';
            data.forEach(note => {
                const item = document.createElement('div');
                item.className = 'note-item';
                
                // Cek ekstensi file jika ada file_url di database Anda
                let tagFile = '';
                if (note.file_url) {
                    if (note.file_url.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                        tagFile = `<img src="${note.file_url}" alt="Gambar Catatan">`;
                    } else {
                        tagFile = `<br><a class="download-link" href="${note.file_url}" target="_blank">📄 Lihat Lampiran Dokumen</a>`;
                    }
                }

                // Menggunakan kolom 'tittle' (dua huruf t) sesuai struktur tabel Anda
                item.innerHTML = `
                    <h3>${note.tittle || '(Tanpa Judul)'}</h3>
                    <small>Dibuat: ${new Date(note.created_at).toLocaleString('id-ID')}</small>
                    ${tagFile}
                `;
                wadahCatatan.appendChild(item);
            });
        }

        // 2. Fungsi Mengunggah File ke Storage dan Menyimpan Data ke Tabel 'Notes'
        async function simpanSemua() {
            const inputJudul = document.getElementById('input-judul');
            const inputFile = document.getElementById('input-file');
            const teksJudul = inputJudul.value.trim();

            if (!teksJudul) {
                alert('Tolong isi judul catatan terlebih dahulu!');
                return;
            }

            let urlFileTerupload = null;

            // Jika user memilih file, upload ke bucket bernama 'files'
            if (inputFile.files.length > 0) {
                const file = inputFile.files[0];
                const namaFileUnik = `${Date.now()}_${file.name}`; // Mencegah nama file duplikat

                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('files')
                    .upload(namaFileUnik, file);

                if (uploadError) {
                    console.error('Gagal upload file:', uploadError);
                    alert('Gagal mengunggah file: ' + uploadError.message + '\n\nApakah bucket bernama "files" sudah dibuat di Supabase?');
                    return; 
                }

                // Dapatkan URL publik dari file yang sukses di-upload
                const { data: urlData } = supabaseClient.storage
                    .from('files')
                    .getPublicUrl(namaFileUnik);
                
                urlFileTerupload = urlData.publicUrl;
            }

            // Masukkan data baru ke tabel 'Notes'
            const { error: insertError } = await supabaseClient
                .from('Notes')
                .insert([
                    { 
                        tittle: teksJudul,        // Kolom judul (tittle)
                        file_url: urlFileTerupload // Kolom link file
                    }
                ]);

            if (insertError) {
                console.error('Gagal insert data:', insertError);
                alert('Gagal menyimpan catatan: ' + insertError.message + '\n\nPastikan kolom "tittle" (dua huruf t) dan "file_url" sudah ada di tabel Notes.');
            } else {
                alert('Catatan berhasil disimpan!');
                inputJudul.value = ''; // Reset input text
                inputFile.value = '';  // Reset input file
                ambilCatatan();        // Segarkan list catatan otomatis
            }
        }

        // Jalankan fungsi saat pertama kali halaman web dibuka
        window.onload = ambilCatatan;
    </script>
</body>
</html>
