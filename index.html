<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>My Dashboard Grid</title>

<!-- Menggunakan CDN alternatif unpkg yang sangat ramah terhadap mobile browser -->
<script src="https://unpkg.com/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #3b82f6, #60a5fa, #93c5fd);
        min-height: 100vh;
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .dashboard-grid {
        width: 100%;
        max-width: 960px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
    }

    @media (max-width: 768px) {
        .dashboard-grid {
            grid-template-columns: 1fr;
        }
    }

    .icloud-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 320px;
    }

    .card-header {
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.5);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .app-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .notes-icon { background: #fef9c3; }
    .drive-icon { background: #e0f2fe; }
    .bookmark-icon { background: #dcfce7; }
    .calc-icon { background: #fee2e2; }

    .app-info h2 {
        font-size: 16px;
        font-weight: 600;
        color: #1e293b;
    }

    .app-info span {
        font-size: 12px;
        color: #64748b;
    }

    .header-btn {
        font-size: 22px;
        cursor: pointer;
        user-select: none;
        padding: 4px;
    }

    .card-body {
        background: #ffffff;
        padding: 20px;
        flex: 1;
        overflow-y: auto;
    }

    .list-container {
        display: flex;
        flex-direction: column;
    }

    .item-row {
        padding: 10px 0;
        border-bottom: 1px solid #f1f5f9;
    }
    .item-row:last-child { border-bottom: none; }

    .item-title {
        font-size: 14px;
        font-weight: 500;
        color: #1e293b;
    }
    .item-meta {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 2px;
    }
    .item-link {
        color: #3b82f6;
        text-decoration: none;
    }

    .drive-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #64748b;
        gap: 12px;
        text-align: center;
        cursor: pointer;
        height: 100%;
    }
    .drive-content .cloud-emoji { font-size: 48px; }

    .calc-box {
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
    }
    .calc-screen {
        width: 100%;
        background: #f1f5f9;
        border: none;
        padding: 12px;
        font-size: 22px;
        text-align: right;
        border-radius: 12px;
        color: #1e293b;
        font-weight: 600;
    }
    .calc-buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        flex: 1;
    }
    .calc-btn {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        color: #334155;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .calc-btn:active { background: #cbd5e1; }
    .btn-operator { background: #ffedd5; color: #ea580c; }
    .btn-equal { background: #3b82f6; color: white; }

    .card-footer {
        padding: 6px 20px 10px 20px;
        background: #ffffff;
        font-size: 12px;
        color: #94a3b8;
        border-top: 1px solid #f8fafc;
    }
</style>
</head>
<body>

<div class="dashboard-grid">

    <!-- BOX 1: CATATAN -->
    <div class="icloud-card">
        <div class="card-header">
            <div class="header-left">
                <div class="app-icon notes-icon">📝</div>
                <div class="app-info">
                    <h2>Catatan</h2>
                    <span>Cloud Database</span>
                </div>
            </div>
            <div class="header-btn" onclick="addNote()">✍️</div>
        </div>
        <div class="card-body">
            <div class="list-container" id="notesContainer">
                <div class="item-meta">Menghubungkan ke server...</div>
            </div>
        </div>
        <div class="card-footer" id="notesFooter">0 Catatan</div>
    </div>

    <!-- BOX 2: DRIVE -->
    <div class="icloud-card">
        <div class="card-header">
            <div class="header-left">
                <div class="app-icon drive-icon">📁</div>
                <div class="app-info">
                    <h2>Drive</h2>
                    <span>Penyimpanan File</span>
                </div>
            </div>
        </div>
        <div class="card-body drive-content" onclick="document.getElementById('fileInput').click()">
            <div class="cloud-emoji">☁️</div>
            <p id="uploadStatus">Klik untuk Unggah Berkas</p>
            <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
        </div>
        <div class="card-footer">Bucket: 'documents'</div>
    </div>

    <!-- BOX 3: BOOKMARK -->
    <div class="icloud-card">
        <div class="card-header">
            <div class="header-left">
                <div class="app-icon bookmark-icon">🔖</div>
                <div class="app-info">
                    <h2>Bookmark</h2>
                    <span>Link Favorit</span>
                </div>
            </div>
            <div class="header-btn" onclick="addBookmark()">➕</div>
        </div>
        <div class="card-body">
            <div class="list-container" id="bookmarkContainer">
                <div class="item-meta">Menghubungkan ke server...</div>
            </div>
        </div>
        <div class="card-footer" id="bookmarkFooter">0 Tautan</div>
    </div>

    <!-- BOX 4: KALKULATOR -->
    <div class="icloud-card">
        <div class="card-header">
            <div class="header-left">
                <div class="app-icon calc-icon">🧮</div>
                <div class="app-info">
                    <h2>Kalkulator</h2>
                    <span>Sistem Instan</span>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="calc-box">
                <input type="text" class="calc-screen" id="calcScreen" readonly value="0">
                <div class="calc-buttons">
                    <button class="calc-btn btn-operator" onclick="clearCalc()">C</button>
                    <button class="calc-btn btn-operator" onclick="pressCalc('/')">/</button>
                    <button class="calc-btn btn-operator" onclick="pressCalc('*')">x</button>
                    <button class="calc-btn btn-operator" onclick="pressCalc('-')">-</button>
                    
                    <button class="calc-btn" onclick="pressCalc('7')">7</button>
                    <button class="calc-btn" onclick="pressCalc('8')">8</button>
                    <button class="calc-btn" onclick="pressCalc('9')">9</button>
                    <button class="calc-btn btn-operator" onclick="pressCalc('+')">+</button>
                    
                    <button class="calc-btn" onclick="pressCalc('4')">4</button>
                    <button class="calc-btn" onclick="pressCalc('5')">5</button>
                    <button class="calc-btn" onclick="pressCalc('6')">6</button>
                    <button class="calc-btn btn-equal" style="grid-row: span 2; height: 100%;" onclick="calculateResult()">=</button>
                    
                    <button class="calc-btn" onclick="pressCalc('1')">1</button>
                    <button class="calc-btn" onclick="pressCalc('2')">2</button>
                    <button class="calc-btn" onclick="pressCalc('3')">3</button>
                    
                    <button class="calc-btn" style="grid-column: span 2;" onclick="pressCalc('0')">0</button>
                    <button class="calc-btn" onclick="pressCalc('.')">.</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const url_db = "https://awlxjzfadktcthbumxle.supabase.co"; 
    const key_db = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3bHhqemZhZGt0Y3RoYnVteGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODU3NzgsImV4cCI6MjA5OTM2MTc3OH0.ktRLTXfsYmzb5RH8qKci0FgENkqqVG9atz5sHls9RXI";

    var clientCloud = null;

    window.onload = function() {
        // Metode inisialisasi yang dipaksa lolos dari kekatutan cakupan jendela Safari
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                clientCloud = window.supabase.createClient(url_db, key_db);
            } else if (typeof supabase !== 'undefined' && supabase.createClient) {
                clientCloud = supabase.createClient(url_db, key_db);
            }
        } catch (e) {
            alert("Gagal memuat library sistem: " + e.message);
        }

        if (clientCloud) {
            loadNotes();
            loadBookmarks();
        } else {
            document.getElementById('notesContainer').innerHTML = "<div class='item-meta' style='color:#ef4444;'>Gagal menginisialisasi skrip database. Harap refresh halaman.</div>";
            document.getElementById('bookmarkContainer').innerHTML = "<div class='item-meta' style='color:#ef4444;'>Gagal memuat sistem.</div>";
        }
    };

    // ====== FUNGSI CATATAN ======
    async function loadNotes() {
        if (!clientCloud) return;
        const container = document.getElementById('notesContainer');
        const footer = document.getElementById('notesFooter');
        try {
            let { data: catatan, error } = await clientCloud.from('catatan').select('*').order('id', { ascending: false }); 
            if (error) throw error;
            if (catatan && catatan.length > 0) {
                footer.innerText = `${catatan.length} Catatan`;
                container.innerHTML = catatan.map(note => `
                    <div class="item-row">
                        <div class="item-title">${note.title || 'Tanpa Judul'}</div>
                        <div class="item-meta">${note.date_label || ''} - <span>${note.description || ''}</span></div>
                    </div>
                `).join('');
            } else { 
                container.innerHTML = '<div class="item-meta">Tidak ada catatan ditemukan.</div>'; 
                footer.innerText = '0 Catatan';
            }
        } catch (error) { 
            container.innerHTML = `<div class="item-meta" style="color:#ef4444;">Koneksi gagal: ${error.message}</div>`; 
        }
    }

    async function addNote() {
        if(!clientCloud) { alert("Sistem belum siap."); return; }
        const title = prompt("Masukkan judul catatan:");
        if (!title) return;
        const description = prompt("Masukkan isi catatan:");
        const now = new Date();
        const date_label = `${now.getDate()}/${now.getMonth() + 1}/${now.getFullYear().toString().substring(2)}`;
        try {
            const { error } = await clientCloud.from('catatan').insert([{ title, description, date_label }]);
            if (error) throw error;
            loadNotes();
        } catch (error) { alert("Gagal Menyimpan: " + error.message); }
    }

    // ====== FUNGSI DRIVE ======
    async function handleFileUpload(event) {
        if(!clientCloud) return;
        const file = event.target.files[0];
        if (!file) return;
        const statusText = document.getElementById('uploadStatus');
        statusText.innerText = `Mengunggah: ${file.name}...`;
        try {
            const fileExt = file.name.split('.').pop();
            const filePath = `uploads/${Math.random()}.${fileExt}`;
            let { error } = await clientCloud.storage.from('documents').upload(filePath, file);
            if (error) throw error;
            statusText.innerText = `✅ Berhasil: ${file.name}`;
        } catch (error) {
            statusText.innerText = "❌ Gagal mengunggah.";
            alert("Error Storage: " + error.message);
        }
    }

    // ====== FUNGSI BOOKMARK ======
    async function loadBookmarks() {
        if (!clientCloud) return;
        const container = document.getElementById('bookmarkContainer');
        const footer = document.getElementById('bookmarkFooter');
        try {
            let { data: bookmarks, error } = await clientCloud.from('bookmarks').select('*').order('id', { ascending: false });
            if (error) throw error;
            if (bookmarks && bookmarks.length > 0) {
                footer.innerText = `${bookmarks.length} Tautan`;
                container.innerHTML = bookmarks.map(bk => `
                    <div class="item-row">
                        <div class="item-title">${bk.nama || 'Tautan Tanpa Nama'}</div>
                        <div class="item-meta"><a href="${bk.url}" target="_blank" class="item-link">${bk.url}</a></div>
                    </div>
                `).join('');
            } else { 
                container.innerHTML = '<div class="item-meta">Tidak ada bookmark ditemukan.</div>'; 
                footer.innerText = '0 Tautan';
            }
        } catch (error) { 
            container.innerHTML = `<div class="item-meta" style="color:#ef4444;">Koneksi gagal: ${error.message}</div>`; 
        }
    }

    async function addBookmark() {
        if(!clientCloud) return;
        const nama = prompt("Masukkan nama/judul website:");
        if (!nama) return;
        let url = prompt("Masukkan URL website:");
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        try {
            const { error } = await clientCloud.from('bookmarks').insert([{ nama, url }]);
            if (error) throw error;
            loadBookmarks();
        } catch (error) { alert("Gagal Menyimpan: " + error.message); }
    }

    // ====== FUNGSI KALKULATOR ======
    let calcExpression = "";
    function pressCalc(val) {
        const screen = document.getElementById('calcScreen');
        if (screen.value === "0" && !isNaN(val)) { calcExpression = val; } else { calcExpression += val; }
        screen.value = calcExpression;
    }
    function clearCalc() { calcExpression = ""; document.getElementById('calcScreen').value = "0"; }
    function calculateResult() {
        const screen = document.getElementById('calcScreen');
        try {
            const result = new Function(`return ${calcExpression}`)();
            screen.value = result;
            calcExpression = result.toString();
        } catch (error) { screen.value = "Error"; calcExpression = ""; }
    }
</script>

</body>
</html>
