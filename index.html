<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OTA Calculator</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif; color: white;}
    body{background:#0f172a;padding: 20px;}
    .container { max-width: 500px; margin: auto; }
    h1{font-size:24px; margin-bottom: 5px;}
    .sub{color:#94a3b8; margin-bottom:15px;}
    label{display:block;margin-bottom:8px;font-weight:600;}
    select,input{width:100%;padding:12px;margin-bottom:15px;border:none;border-radius:8px;background:#1e293b;color:white;}
    .input-row{display:flex;gap:10px;}
    button{padding:10px 20px;border:none;border-radius:8px;background:#22c55e;font-weight:bold;cursor:pointer;}
    .status{margin-bottom:15px;padding:8px 12px;border-radius:8px;display:inline-block;background:#f59e0b;color:#111;font-size:14px;}
    
    /* Box Hasil */
    .result-box{background:#16a34a;padding:20px;border-radius:12px;text-align:center;margin-bottom:20px;}
    .big{font-size:32px; font-weight:bold; margin-bottom:5px;}
    .info-text{font-size:14px; opacity: 0.9;}
    
    .grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:10px;}
    .box{background:#1e293b;padding:10px;border-radius:8px;text-align:center;font-size:12px;}
</style>
</head>
<body>

<div class="container">
    <h1>OTA Calculator</h1>
    <div class="sub">Traveloka / My Horison</div>
    
    <label>OTA</label>
    <select id="ota" onchange="calc()">
        <option value="traveloka">Traveloka</option>
        <option value="my">My Horison</option>
    </select>
    
    <label>Voucher</label>
    <div class="input-row">
        <input id="input" type="tel" inputmode="numeric" placeholder="Masukkan harga..." oninput="calc()">
        <button onclick="submit()">Submit</button>
    </div>
    
    <div id="status" class="status">🟡 Belum disimpan</div>

    <div class="result-box">
        <div class="info-text">Room Revenue (Net)</div>
        <div id="net" class="big">Rp 0</div>
        <div id="details" class="info-text">Harga Tamu (Gross): Rp 0<br>Potongan OTA: Rp 0</div>
    </div>

    <div class="grid" id="gridBox"></div>
</div>

<script>
    const gridBox = document.getElementById("gridBox");
    gridBox.innerHTML = [2,3,4,5,6,7,8,9].map(i => `<div class="box">÷${i}<br><b>0</b></div>`).join('');

    function n(x){ return Math.round(x).toLocaleString("id-ID"); }
    function c(v){ return parseFloat((v||"").replace(/[^0-9]/g,''))||0; }

    function calc(){
        let val = c(document.getElementById("input").value);
        let o = document.getElementById("ota").value;
        let netV = 0, gross = 0, potongan = 0;

        if(o == "my") {
            gross = val;
            potongan = val * 0.12;
            netV = val - potongan;
        } else {
            gross = val / 0.82;
            potongan = (gross * 0.25);
            netV = gross - potongan;
        }

        document.getElementById("net").innerHTML = "Rp " + n(netV);
        document.getElementById("details").innerHTML = `Harga Tamu (Gross): Rp ${n(gross)}<br>Potongan OTA: Rp ${n(potongan)}`;
        
        let grids = document.querySelectorAll(".box");
        [2,3,4,5,6,7,8,9].forEach((i, idx) => {
            grids[idx].innerHTML = `÷${i}<br><b>${n(netV/i)}</b>`;
        });
    }

    function submit(){
        document.getElementById("status").innerHTML = "🟢 Tersimpan";
        document.getElementById("status").style.background = "#22c55e";
    }
</script>
</body>
</html>
