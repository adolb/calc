<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Files</title>

<style>
body{
font-family:Arial;
background:#f5f7fb;
padding:20px
}

.box{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px #ddd
}

h2{
color:#2563eb
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd
}

button{
background:#2563eb;
color:white;
border:0;
font-size:16px
}

.file{
padding:15px;
margin-top:12px;
background:#f8fafc;
border-radius:12px
}

a{
text-decoration:none;
color:#2563eb
}
</style>

</head>

<body>

<div class="box">

<h2>📁 My Files</h2>

<input type="file" id="file">

<button onclick="uploadFile()">Upload</button>

<div id="list"></div>

</div>


<script>

const URL="https://awlxjzfadktcthbumxle.supabase.co";

const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3bHhqemZhZGt0Y3RoYnVteGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODU3NzgsImV4cCI6MjA5OTM2MTc3OH0.ktRLTXfsYmzb5RH8qKci0FgENkqqVG9atz5sHls9RXI";


async function uploadFile(){

let file=document.getElementById("file").files[0];

if(!file) return alert("Pilih file");


let path=Date.now()+"_"+file.name;


let upload=await fetch(
URL+"/storage/v1/object/files/"+path,
{
method:"POST",
headers:{
"apikey":KEY,
"Authorization":"Bearer "+KEY,
"Content-Type":file.type
},
body:file
});


if(upload.ok){
alert("Upload berhasil");
loadFiles();
}else{
alert("Upload gagal");
}

}



async function loadFiles(){

let res=await fetch(
URL+"/storage/v1/object/list/files",
{
method:"POST",
headers:{
"apikey":KEY,
"Authorization":"Bearer "+KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({})
});


let data=await res.json();

let html="";


data.forEach(f=>{

let link=
URL+"/storage/v1/object/public/files/"+f.name;


html+=`

<div class="file">
📄 <a href="${link}" target="_blank">
${f.name}
</a>
</div>

`;

});


document.getElementById("list").innerHTML=html;

}


loadFiles();

</script>

</body>
</html>
